services:
  web:
    container_name: Agritech-SAAS
    build:
      context: .
      dockerfile: backend/infra/Dockerfile
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --chdir backend/core_saas
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - portfolio-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: backend/infra/Dockerfile
    working_dir: /app/backend/core_saas
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - portfolio-network

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - portfolio-network

  stripe-cli:
    image: stripe/stripe-cli:latest
    command: "listen --api-key ${STRIPE_SECRET_KEY} --forward-to web:8000/api/subscriptions/webhook/"
    env_file:
      - .env
    depends_on:
      - web
    networks:
      - portfolio-network

networks:
  portfolio-network:
    external: true
